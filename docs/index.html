function viewExerciseProgress(id){
  const e = getExercise(id);
  if(!e) return `<div class="empty"><h3>Not found</h3></div>`;
  const sessions = [...state.history].sort((a,b)=>new Date(a.startTime)-new Date(b.startTime));
  const points = [];
  for(const w of sessions){
    const ex = w.exercises.find(x=>x.exerciseId===id);
    if(!ex) continue;
    const completed = ex.sets.filter(s=>s.completed);
    if(completed.length===0) continue;
    if(e.type==='bodyweight'){
      const best = Math.max(...completed.map(s=>s.reps||0));
      points.push({x:new Date(w.startTime).getTime(), y:best});
    } else {
      const best1rm = Math.max(...completed.map(s=>epley1RM(s.weight||0,s.reps||0)));
      points.push({x:new Date(w.startTime).getTime(), y:round1(best1rm)});
    }
  }
  const b = getBests(id, state.history);
  return `
    <h2 style="font-size:20px;margin-bottom:14px;">${esc(e.name)}</h2>
    <div class="stat-strip">
      ${e.type==='bodyweight' ? `<div class="stat"><div class="num">${b.maxReps}</div><div class="lbl">Best Reps</div></div>` : `
      <div class="stat"><div class="num">${b.maxWeight}</div><div class="lbl">Top KG</div></div>
      <div class="stat"><div class="num">${b.max1rm}</div><div class="lbl">Est 1RM</div></div>
      <div class="stat"><div class="num">${b.maxVolume}</div><div class="lbl">Best Vol</div></div>`}
    </div>
    <div class="section-title">${e.type==='bodyweight'?'Reps over time':'Estimated 1RM over time'}</div>
    <div class="card">${buildLineChart(points,{color:cv('--blue')})}</div>
  `;
}

function weeklyVolumeSeries(weeks){
  const now = new Date();
  const bars=[];
  for(let i=weeks-1;i>=0;i--){
    const wkStart = startOfISOWeek(new Date(now.getTime() - i*7*86400000));
    const wkEnd = new Date(wkStart.getTime()+7*86400000);
    const vol = state.history.filter(w=>{ const t=new Date(w.startTime); return t>=wkStart && t<wkEnd; })
      .reduce((s,w)=>s+workoutVolume(w),0);
    bars.push({label: wkStart.toLocaleDateString(undefined,{month:'short',day:'numeric'}), v: Math.round(vol)});
  }
  return bars;
}
function weeklyFrequencySeries(weeks){
  const now = new Date();
  const bars=[];
  for(let i=weeks-1;i>=0;i--){
    const wkStart = startOfISOWeek(new Date(now.getTime() - i*7*86400000));
    const wkEnd = new Date(wkStart.getTime()+7*86400000);
    const c = state.history.filter(w=>{ const t=new Date(w.startTime); return t>=wkStart && t<wkEnd; }).length;
    bars.push({label: wkStart.toLocaleDateString(undefined,{month:'short',day:'numeric'}), v: c});
  }
  return bars;
}
function muscleDistribution(){
  const counts = {};
  let total=0;
  for(const w of state.history){
    for(const ex of w.exercises){
      const n = ex.sets.filter(s=>s.completed).length;
      if(n===0) continue;
      counts[ex.muscleGroup] = (counts[ex.muscleGroup]||0)+n;
      total += n;
    }
  }
  if(total===0) return [];
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([group,c])=>({group, pct: Math.round(c/total*100)}));
}
const MOCK_FRIENDS = [
  {name:'Jordan', volume:48200, count:41},

function buildLeaderboard(){
  const myVolume = state.history.reduce((s,w)=>s+workoutVolume(w),0);
  const myCount = state.history.length;
  const rows = [
    ...MOCK_FRIENDS.map(f=>({name:f.name, volume:f.volume, count:f.count, me:false})),
    {name:'You', volume:myVolume, count:myCount, me:true}
  ];
  const mode = state.lbMode==='count' ? 'count' : 'volume';
  rows.sort((a,b)=>b[mode]-a[mode]);
  return rows.map(r=>({name:r.name, me:r.me, display: mode==='count' ? `${r.count} wk` : `${Math.round(r.volume)} kg`}));
}

function finishWorkout(){
  const w = state.activeWorkout;
  if(!w) return;
  const hasCompleted = w.exercises.some(ex=>ex.sets.some(s=>s.completed));
  if(!hasCompleted){
    confirmDialog('Finish without logging?', 'No sets have been marked complete in this workout. Finish anyway?', 'Finish Anyway', ()=>{
      if(w.backdated) promptBackdatedDuration(); else doFinishWorkout(null);
    });
    return;

  if(w.backdated) promptBackdatedDuration();
  else doFinishWorkout(null);
}
function promptBackdatedDuration(){
  promptDialog('How long was this workout?', 'Minutes', '45', (val)=>{
    const mins = Math.max(1, num(val, 45));
    doFinishWorkout(null, Math.round(mins*60));
  }, {type:'number', inputmode:'numeric'});

function doFinishWorkout(photoDataUrl, manualDurationSec){
  const w = state.activeWorkout;
  let endTime, durationSec;
  if(manualDurationSec!=null){
    durationSec = manualDurationSec;
    endTime = new Date(new Date(w.startTime).getTime() + durationSec*1000).toISOString();
  } else {
    endTime = new Date().toISOString();
    durationSec = Math.max(1, Math.round((new Date(endTime)-new Date(w.startTime))/1000));
  }
  const historyBefore = state.history;
  const prs = computeSessionPRs(w, historyBefore);
  const finished = {
    id: w.id, name: w.name || 'Workout', startTime: w.startTime, endTime, durationSec,
    exercises: w.exercises.map(ex=>({
      exerciseId: ex.exerciseId, name: ex.name, muscleGroup: ex.muscleGroup, type: ex.type,
      notes: (getExercise(ex.exerciseId)||{}).notes || '',
      sets: ex.sets.map(s=>({weight:s.weight??null, reps:s.reps??null, duration:s.duration??null, distance:s.distance??null, completed:!!s.completed, note:s.note||''}))
    })),
    photo: photoDataUrl, prs
  };
  finished.totalVolume = workoutVolume(finished);
  const wasBackdated = !!w.backdated;
  const backdatedDateISO = wasBackdated ? fmtDateISO(w.startTime) : null;
  state.history.unshift(finished);
  state.activeWorkout = null;
  saveKey('history');
  deleteKeySafe('activeWorkout');
  stopTickers();
  state.stack = [];
  if(wasBackdated){
    push('dayDetail', {date: backdatedDateISO});
    showToast(finished.prs.length ? `Workout logged · ${finished.prs.length} new PR${finished.prs.length!==1?'s':''}!` : 'Workout logged');
  } else {
    push('workoutDetail', {id: finished.id});
    if(finished.prs.length) showToast(`${finished.prs.length} new PR${finished.prs.length!==1?'s':''} this session!`);
  }
}

      if(s.duration==null || s.duration===''){ showToast('Enter a duration first'); return; }

function startTickers(){
  stopTickers();
  state.restTicker = setInterval(()=>{
    if(!state.activeWorkout || !state.activeWorkout.restTimer) return;
    const remaining = Math.round((state.activeWorkout.restTimer.endsAt - Date.now())/1000);
    const el = document.getElementById('rest-time');
    if(el) el.textContent = fmtClockCount(Math.max(0,remaining));
    if(remaining<=0){
      state.activeWorkout.restTimer = null;
      saveKey('activeWorkout');
      renderRestBar();
      if(navigator.vibrate) navigator.vibrate([120,60,120]);
      showToast('Rest complete');
    }
  }, 1000);
  state.elapsedTicker = setInterval(()=>{
    if(!state.activeWorkout) return;
    const elapsed = Math.round((Date.now()-new Date(state.activeWorkout.startTime).getTime())/1000);
    const el = document.getElementById('elapsed-display');
    if(el) el.textContent = fmtClockCount(elapsed);
    const bannerEl = document.getElementById('active-banner-time');
    if(bannerEl) bannerEl.textContent = fmtClockCount(elapsed);
  }, 1000);
}
function stopTickers(){
  if(state.restTicker) clearInterval(state.restTicker);
  if(state.elapsedTicker) clearInterval(state.elapsedTicker);
  state.restTicker = state.elapsedTicker = null;
}

async function shareWorkout(id){

    </div>

        <button class="btn primary" id="native-share-btn">${ic('share','sm')} Share</button>

    </div>
  `);
  const btn = document.getElementById('native-share-btn');
  btn.onclick = async ()=>{
    if(!navigator.share){
      showToast("Sharing isn't available in this browser — use Download instead");
      return;
    }
    let file = null;
    try{
      const blob = await (await fetch(dataUrl)).blob();
      file = new File([blob], 'overload-workout.png', {type:'image/png'});
    }catch(e){ file = null; }
    const text = `${w.name} — ${fmtDuration(w.durationSec)}${workoutStatInline(w)?', '+workoutStatInline(w):''}`;
    try{
      if(file && navigator.canShare && navigator.canShare({files:[file]})){

      } else {
        await navigator.share({title:'Overload workout', text});
      }
    }catch(e){

      showToast("Couldn't open sharing — use Download instead");
    }
  };
}
function drawStar(ctx, cx, cy, outerR, innerR, fill){
  const spikes = 5;
  let rot = -Math.PI/2, step = Math.PI/spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy-outerR);
  for(let i=0;i<spikes;i++){
    ctx.lineTo(cx+Math.cos(rot+step)*innerR, cy+Math.sin(rot+step)*innerR);
    rot += step*2;
    ctx.lineTo(cx+Math.cos(rot)*outerR, cy+Math.sin(rot)*outerR);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}
function generateShareCardImage(w){
  const validExercises = w.exercises.filter(ex=>ex.sets.some(s=>s.completed)).slice(0,10);
  const headerH = 375, lineH = 60, footerH = 70;
  const canvasH = Math.max(480, Math.min(1200, headerH + validExercises.length*lineH + footerH));

  const canvas = document.createElement('canvas');
  canvas.width = 1080; canvas.height = canvasH;
  const ctx = canvas.getContext('2d');
  const dark = document.documentElement.getAttribute('data-theme')!=='light';
  const bg = dark? '#12150f':'#f5f6f0', ink = dark? '#eef0e6':'#161a10', dim = dark? '#9aa38d':'#5b6350';
  ctx.fillStyle = bg; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#ff7a1a'; ctx.fillRect(0,0,canvas.width,16);

  ctx.fillStyle = ink; ctx.font='700 56px Inter, sans-serif'; wrapText(ctx, w.name, 64, 100, 950, 60);
  ctx.fillStyle = dim; ctx.font='400 28px Inter, sans-serif'; ctx.fillText(fmtDateLong(w.startTime), 64, 150);

  const volStat = workoutStatLabel(w);
  const stats = [['DURATION', fmtDuration(w.durationSec)], [volStat?volStat.label.toUpperCase():'VOLUME', volStat?volStat.value:'—'], ['PRs', String((w.prs||[]).length)]];
  let sx = 64;
  stats.forEach(([label,val])=>{
    ctx.fillStyle = '#ff7a1a'; ctx.font="700 54px 'JetBrains Mono', sans-serif"; ctx.fillText(val, sx, 245);
    ctx.fillStyle = dim; ctx.font='600 22px Inter, sans-serif'; ctx.fillText(label, sx, 278);
    sx += 340;
  });

  ctx.strokeStyle = dark? '#2a3023':'#dde1d3'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(64,310); ctx.lineTo(1016,310); ctx.stroke();

  let y = 375;
  validExercises.forEach(ex=>{
    const completed = ex.sets.filter(s=>s.completed);
    let line;
    if(ex.type==='cardio'){
      const totalMin = completed.reduce((s,x)=>s+(x.duration||0),0);
      line = `${ex.name} — ${totalMin}min`;
    } else if(ex.type==='bodyweight'){
      line = `${ex.name} — ${completed.length} set${completed.length!==1?'s':''}`;
    } else {
      const best = Math.max(...completed.map(s=>s.weight||0));
      line = `${ex.name} — ${completed.length} set${completed.length!==1?'s':''}, top ${best}kg`;
    }
    const truncated = line.length>44? line.slice(0,44)+'…' : line;
    ctx.font='600 36px Inter, sans-serif'; ctx.fillStyle = ink;
    ctx.fillText(truncated, 64, y);
    const hasPR = (w.prs||[]).some(p=>p.exerciseId===ex.exerciseId);
    if(hasPR){
      const badgeX = 64 + ctx.measureText(truncated).width + 32;
      const cy = y-14;
      ctx.strokeStyle = '#ff7a1a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(badgeX-6, cy-8); ctx.lineTo(badgeX-11, cy-22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(badgeX+6, cy-8); ctx.lineTo(badgeX+11, cy-22); ctx.stroke();
      ctx.beginPath(); ctx.arc(badgeX, cy, 17, 0, Math.PI*2); ctx.fillStyle = '#ff7a1a'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#2a0f00'; ctx.stroke();
      drawStar(ctx, badgeX, cy, 9, 4, '#2a0f00');
      ctx.fillStyle = '#ff7a1a'; ctx.font="700 28px 'JetBrains Mono', sans-serif"; ctx.textAlign='left';
      ctx.fillText('PB', badgeX+26, y);
    }
    y += lineH;
  });

  ctx.font='500 24px Inter, sans-serif'; ctx.fillStyle = dim;
  ctx.fillText('Logged with Overload', 64, canvas.height-32);
  return canvas.toDataURL('image/png');
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line='';
  for(const word of words){
    const test = line + word + ' ';
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, y); line = word+' '; y += lineHeight;
    } else line = test;
  }
  ctx.fillText(line, x, y);
}

function toCSV(rows){
  return rows.map(r=>r.map(v=>{
    const s = String(v==null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime||'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function exportWorkoutsCSV(){
  const rows = [['Date','Workout','Exercise','Set','Weight (kg)','Reps','Duration (min)','Distance (km)','Completed','Note']];
  [...state.history].sort((a,b)=>new Date(a.startTime)-new Date(b.startTime)).forEach(w=>{
    w.exercises.forEach(ex=>{
      ex.sets.forEach((s,i)=>{
        rows.push([
          fmtDateISO(w.startTime), w.name, ex.name, i+1,
          ex.type==='weighted'?(s.weight??''):'',
          ex.type==='cardio'?'':(s.reps??''),
          ex.type==='cardio'?(s.duration??''):'',
          ex.type==='cardio'?(s.distance??''):'',
          s.completed?'yes':'no', (s.note||'').replace(/\n/g,' ')
        ]);
      });
    });
  });
  downloadFile('overload-workouts.csv', toCSV(rows));
  showToast('Workout data exported');
}
function exportBodyCSV(){
  const rows = [['Date','Field','Value']];
  [...state.measurements].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(e=>{
    state.measurementFields.forEach(f=>{ if(e.values[f.id]!=null) rows.push([e.date, `${f.name} (${f.unit})`, e.values[f.id]]); });
  });
  downloadFile('overload-measurements.csv', toCSV(rows));
  showToast('Measurements exported');
}

const WHEEL_ITEM_H = 44;
let pendingRestSave = null;
function buildWheelColumn(id, values, current){
  const items = values.map(v=>`<div class="wheel-item" data-value="${v}">${v}</div>`).join('');
  return `<div class="wheel-col" id="${id}">
    <div class="wheel-spacer"></div><div class="wheel-spacer"></div>
    ${items}
    <div class="wheel-spacer"></div><div class="wheel-spacer"></div>
  </div>`;
}
function openRestWheelPicker(currentSeconds, onSave){
  const mins = Array.from({length:11},(_,i)=>i); // 0-10 min
  const secs = Array.from({length:12},(_,i)=>i*5); // 0,5,...,55 sec
  const curMin = clamp(Math.floor(currentSeconds/60), 0, 10);
  const rawSec = currentSeconds%60;
  let nearestSecIdx = 0;
  secs.forEach((v,i)=>{ if(Math.abs(v-rawSec) < Math.abs(secs[nearestSecIdx]-rawSec)) nearestSecIdx = i; });

  pendingRestSave = onSave;
  openModal(`
    <h3>Rest duration</h3>
    <p class="sub">Scroll each wheel to set how long you rest between sets.</p>
    <div class="wheel-row">
      <div class="wheel-stack"><div class="wheel-highlight"></div>${buildWheelColumn('wheel-col-min', mins, curMin)}</div>
      <div class="wheel-stack"><div class="wheel-highlight"></div>${buildWheelColumn('wheel-col-sec', secs, secs[nearestSecIdx])}</div>
    </div>
    <div class="wheel-labels"><span>min</span><span>sec</span></div>
    <button class="btn primary" style="margin-top:18px;" data-action="save-rest-wheel">Save</button>
  `);
  requestAnimationFrame(()=>{
    const minEl = document.getElementById('wheel-col-min');
    const secEl = document.getElementById('wheel-col-sec');
    if(minEl) minEl.scrollTop = mins.indexOf(curMin) * WHEEL_ITEM_H;
    if(secEl) secEl.scrollTop = nearestSecIdx * WHEEL_ITEM_H;
  });
}
function commitRestWheel(){
  const minEl = document.getElementById('wheel-col-min');
  const secEl = document.getElementById('wheel-col-sec');
  if(!minEl || !secEl || !pendingRestSave) return;
  const minIdx = clamp(Math.round(minEl.scrollTop / WHEEL_ITEM_H), 0, 10);
  const secIdx = clamp(Math.round(secEl.scrollTop / WHEEL_ITEM_H), 0, 11);
  const totalSeconds = Math.max(5, minIdx*60 + secIdx*5);
  const cb = pendingRestSave;
  pendingRestSave = null;
  closeModal();
  cb(totalSeconds);
}

/* ============================================================================
   SWIPE-DOWN-TO-DISMISS (bottom sheets) — dragging the handle down past a
   threshold closes the sheet; releasing early snaps it back open.
============================================================================ */
let sheetDragState = null;
const SHEET_DISMISS_THRESHOLD = 90;
document.addEventListener('pointerdown', (e)=>{
  const handle = e.target.closest('.sheet .handle');
  if(!handle) return;
  const sheet = handle.closest('.sheet');
  if(!sheet) return;
  e.preventDefault();
  handle.setPointerCapture && handle.setPointerCapture(e.pointerId);
  sheet.style.transition = 'none';
  sheetDragState = { sheet, startY: e.clientY, dy: 0 };
});
document.addEventListener('pointermove', (e)=>{
  if(!sheetDragState) return;
  e.preventDefault();
  const dy = Math.max(0, e.clientY - sheetDragState.startY); // only allow dragging downward
  sheetDragState.dy = dy;
  sheetDragState.sheet.style.transform = `translateY(${dy}px)`;
}, {passive:false});
function endSheetDrag(){
  if(!sheetDragState) return;
  const { sheet, dy } = sheetDragState;
  if(dy > SHEET_DISMISS_THRESHOLD){
    sheet.style.transition = 'transform .18s ease';
    sheet.style.transform = 'translateY(100%)';
    setTimeout(()=>{ closeModal(); }, 170);
  } else {
    sheet.style.transition = 'transform .2s ease';
    sheet.style.transform = 'translateY(0)';
  }
  sheetDragState = null;
}
document.addEventListener('pointerup', endSheetDrag);
document.addEventListener('pointercancel', endSheetDrag);

/* ============================================================================
   SWIPE-TO-REVEAL DELETE (set rows) — reveals a fixed-width bin icon; tapping
   the bin is what actually deletes. Swiping further doesn't auto-delete.
============================================================================ */
let swipeState = null;
let openSwipeWrap = null;
const SWIPE_REVEAL = 72; // px — matches .set-swipe-bg width
function closeOpenSwipe(){
  if(!openSwipeWrap) return;
  const row = openSwipeWrap.querySelector('.set-row');
  row.style.transition = 'transform .18s ease';
  row.style.transform = 'translateX(0)';
  openSwipeWrap.dataset.open = '';
  openSwipeWrap = null;
}
document.addEventListener('pointerdown', (e)=>{
  const wrap = e.target.closest('.set-swipe-wrap');
  if(!wrap){ closeOpenSwipe(); return; } // tapped outside any row — close whatever's open
  if(e.target.closest('.set-swipe-bg')) return; // let the bin's own tap fire normally
  if(e.target.closest('button')) return; // never hijack the checkmark button; inputs are fine, protected by direction-lock below
  if(wrap !== openSwipeWrap) closeOpenSwipe(); // opening/touching a different row closes the previously-open one
  const row = wrap.querySelector('.set-row');
  const baseX = wrap.dataset.open==='1' ? -SWIPE_REVEAL : 0;
  swipeState = { wrap, row, startX: e.clientX, startY: e.clientY, baseX, dx: baseX, locked:false };
});
document.addEventListener('pointermove', (e)=>{
  if(!swipeState) return;
  const dx = e.clientX - swipeState.startX;
  const dy = e.clientY - swipeState.startY;
  if(!swipeState.locked){
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // not moved enough to decide direction yet
    if(Math.abs(dy) > Math.abs(dx)){ swipeState = null; return; } // vertical scroll intent, bail out
    swipeState.locked = true;
    swipeState.row.style.transition = 'none';
  }
  swipeState.dx = Math.max(-SWIPE_REVEAL, Math.min(0, swipeState.baseX + dx)); // clamp: can't reveal further than the bin's width, can't go past closed
  swipeState.row.style.transform = `translateX(${swipeState.dx}px)`;
});
function endSwipe(){
  if(!swipeState) return;
  const { row, wrap, dx } = swipeState;
  row.style.transition = 'transform .18s ease';
  if(dx < -SWIPE_REVEAL/2){
    row.style.transform = `translateX(${-SWIPE_REVEAL}px)`;
    wrap.dataset.open = '1';
    openSwipeWrap = wrap;
  } else {
    row.style.transform = 'translateX(0)';
    wrap.dataset.open = '';
    if(openSwipeWrap===wrap) openSwipeWrap = null;
  }
  swipeState = null;
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

async function init(){
  // Restore the session *before* loadState, which keys everything off userId().
  if(sb){
    try{
      const { data } = await sb.auth.getSession();
      session = data.session || null;
    }catch(e){
      console.warn('Could not read stored session:', e.message||e);
    }
    sb.auth.onAuthStateChange((event, s)=>{
      session = s || null;
      if(event==='PASSWORD_RECOVERY'){
        // Opened a reset link — show the new-password form.
        state.authMode = 'reset';
        render();
      }else if(event==='TOKEN_REFRESHED'){
        flushDirty();
      }
    });
  }
  // Default the gate to sign-in for anyone who has an account on this device
  // already; first-time visitors still land on registration.
  if(!session && localStorage.getItem(LS_PREFIX+'__seen')) state.authMode = 'login';
  if(session){ try{ localStorage.setItem(LS_PREFIX+'__seen','1'); }catch(e){} }

  await loadState();
  document.documentElement.setAttribute('data-theme', state.settings.theme||'light');
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  if(state.activeWorkout && !state.activeWorkout.backdated){ startTickers(); }
  render();
}
init();

// Register the service worker for offline support / installability.
// Guarded so it's a silent no-op anywhere this API isn't available
// (e.g. Claude's artifact viewer, or file:// during local testing).
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* not hosted yet / not supported here */ });
  });
}

})();
</script>
