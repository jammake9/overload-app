<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Overload — Workout Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overload">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<!-- Supabase client, vendored locally so the app has no runtime CDN dependency
     and still works offline / inside the Capacitor shell. Exposes `supabase`. -->
<script src="vendor/supabase.js"></script>
<script src="supabase-config.js"></script>
<style>
/* ============================= RESET & TOKENS ============================= */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;overscroll-behavior-y:none;}
:root{
  --bg:linear-gradient(165deg, #3c3c3c 0%, #232323 55%, #161616 100%);
  --chrome-bg:rgba(255,255,255,.055);
  --modal-bg:#262625;
  --bg-solid:#38382f;
  --nav-bg:#171713;
  --surface:#242420; --surface-2:#2d2d27; --surface-3:#38382f;
  --border:rgba(255,255,255,.13); --border-soft:rgba(255,255,255,.07);
  --text:#f3f3f2; --text-dim:#aaa9a6; --text-faint:#77746f;
  --accent:#ff7a1a; --accent-grad:linear-gradient(135deg,#ffab5e,#ff7a1a); --accent-soft:rgba(255,122,26,.16); --accent-faint:rgba(255,122,26,.07); --accent-faint-solid:#2e2720; --accent-ink:#2a0f00;
  --blue:#4f9dff; --blue-soft:#1c3252;
  --red:#ff6b5e; --red-soft:#3a201d;
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --font-d:'JetBrains Mono',monospace; --font-b:'Inter',system-ui,-apple-system,sans-serif; --font-h:'Space Grotesk',var(--font-b);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
}
html[data-theme="light"]{
  --bg:linear-gradient(165deg, #eef0f1 0%, #dfe2e4 55%, #cdd1d4 100%);
  --chrome-bg:rgba(255,255,255,.65);
  --modal-bg:#ffffff;
  --bg-solid:#e9ebe7;
  --nav-bg:#cbcfd1;
  --surface:#ffffff; --surface-2:#f2f4f5; --surface-3:#e6e9eb;
  --border:#d7dade; --border-soft:#e6e8ea;
  --text:#191a1b; --text-dim:#54585c; --text-faint:#83878b;
  --accent:#e35d10; --accent-grad:linear-gradient(135deg,#ffab5e,#e35d10); --accent-soft:rgba(227,93,16,.12); --accent-faint:rgba(227,93,16,.06); --accent-faint-solid:#fdf1e5; --accent-ink:#2a0f00;
  --blue:#2f6fe0; --blue-soft:#dbe7fb;
  --red:#d94a3d; --red-soft:#f9dedb;
}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-b);
  -webkit-font-smoothing:antialiased; line-height:1.4;
}
h1,h2,h3,h4{font-family:var(--font-d); font-weight:600; margin:0; letter-spacing:.2px;}
h1{font-family:var(--font-h); font-weight:700; letter-spacing:-.4px;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s);}
a{color:inherit;}
::selection{background:var(--accent); color:var(--accent-ink);}

/* ============================= LAYOUT ============================= */
#loading{
  position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg); gap:14px; z-index:999;
}
#loading .mark{width:56px;height:56px;}
#loading p{color:var(--text-dim); font-size:14px;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; display:flex; flex-direction:column;}

#topbar-slot{display:contents;}
.topbar{
  padding:calc(var(--safe-t) + 14px) 18px 12px; display:flex; align-items:center; justify-content:space-between;
  gap:10px; position:sticky; top:0; background:var(--bg-solid); z-index:20; border-bottom:1px solid transparent;
}
.topbar.bordered{border-bottom:1px solid transparent;}
.topbar .title-row{display:flex; align-items:center; gap:10px;}
.topbar h1{font-size:21px; font-weight:700; letter-spacing:.5px;}
.title-tick{width:4px; height:19px; border-radius:2px; background:var(--accent-grad); flex-shrink:0; display:inline-block;}
.wk-title-block{display:flex; flex-direction:column; gap:1px; min-width:0;}
.wk-name-input{background:none; border:none; padding:0; font-family:var(--font-d); font-size:18px; font-weight:700; letter-spacing:.3px; color:var(--text); max-width:170px;}
.wk-timer{font-size:11px; color:var(--text-dim); font-variant-numeric:tabular-nums; font-weight:600;}
.topbar .back-btn{display:flex; align-items:center; justify-content:center; width:38px; height:38px; margin-left:-8px; border-radius:50%; background:transparent; border:none; color:var(--text); cursor:pointer;}
.topbar .back-btn:active{background:var(--surface-2);}
.topbar .action{background:var(--accent-grad); border:none; color:var(--accent-ink); font-weight:700; font-size:13.5px; cursor:pointer; padding:9px 18px; border-radius:99px; line-height:1.2;}
.topbar .action:active{filter:brightness(.94);}
.topbar .action.muted{background:none; color:var(--text-dim); padding:8px 4px; font-weight:600;}
.topbar .action:disabled{background:var(--surface-3); color:var(--text-faint); cursor:default; filter:none;}

.active-banner{
  margin:0 16px 10px; padding:10px 14px; background:var(--accent-soft); border:1px solid var(--accent);
  border-radius:var(--radius-m); display:flex; align-items:center; justify-content:space-between; cursor:pointer;
}
.active-banner .l{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--text);}
.active-banner .dot{width:8px;height:8px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 0 rgba(255,122,26,.6); animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,26,.5);}70%{box-shadow:0 0 0 8px rgba(255,122,26,0);}100%{box-shadow:0 0 0 0 rgba(255,122,26,0);}}
.active-banner .t{font-family:var(--font-d); font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums;}

main#screen{flex:1; padding:0 16px calc(var(--nav-h) + var(--safe-b) + 24px);}
main#screen.no-nav-pad{padding-bottom:24px;}

.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
  display:flex; background:var(--nav-bg); border-top:1px solid var(--border);
  padding-bottom:var(--safe-b); z-index:30;
}
.bottom-nav button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; color:var(--text-faint); padding:9px 0 8px; cursor:pointer; height:var(--nav-h);
}
.bottom-nav button.active{color:var(--accent);}
.bottom-nav button span{font-size:11px; font-weight:600;}

.rest-bar{
  position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + var(--safe-b)); max-width:480px; margin:0 auto;
  background:var(--nav-bg); border-top:1px solid var(--accent); padding:10px 16px; display:flex; align-items:center;
  justify-content:space-between; z-index:29; gap:10px;
}
.rest-bar.hidden{display:none;}
.rest-bar .info{display:flex; flex-direction:column; gap:1px; min-width:0;}
.rest-bar .info b{font-size:12px; color:var(--text-dim); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rest-bar .info .time{font-family:var(--font-d); font-size:22px; color:var(--accent); font-variant-numeric:tabular-nums;}
.rest-bar .btns{display:flex; gap:6px; flex-shrink:0;}
.rest-bar .btns button{background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-s); padding:8px 10px; font-size:12px; font-weight:600; cursor:pointer;}

/* ============================= COMMON COMPONENTS ============================= */
.icon{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block;}
.icon.sm{width:17px;height:17px;}
.icon.fill{fill:currentColor; stroke:none;}

.stat-strip{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); margin:4px 0 18px; overflow:hidden;}
.stat-strip .stat{flex:1; padding:14px 6px; text-align:center; border-right:1px solid var(--border);}
.stat-strip .stat:last-child{border-right:none;}
.stat-strip .stat .num{font-family:var(--font-d); font-size:26px; color:var(--text); font-variant-numeric:tabular-nums; line-height:1;}
.stat-strip .stat .lbl{font-size:10.5px; color:var(--text-faint); font-weight:600; letter-spacing:.4px; margin-top:4px; text-transform:uppercase;}

.stat-cards{display:flex; gap:10px; margin:4px 0 18px;}
.stat-card{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px 6px; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.07);}
.stat-card .num{font-family:var(--font-d); font-size:26px; color:var(--text); font-variant-numeric:tabular-nums; line-height:1;}
.stat-card .lbl{font-size:10.5px; color:var(--text-faint); font-weight:600; letter-spacing:.4px; margin-top:4px; text-transform:uppercase;}

.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint); font-weight:700; margin:22px 0 10px;}
.section-title:first-child{margin-top:4px;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px;}
.list{display:flex; flex-direction:column; gap:10px;}

.feed-row{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;}
.feed-row .main{min-width:0;}
.feed-row .name{font-weight:600; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.feed-row .meta{color:var(--text-dim); font-size:12.5px; margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.feed-row .right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.home-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:15px; margin-bottom:12px; box-shadow:0 2px 10px rgba(0,0,0,.07); cursor:pointer;}
.home-card .hc-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.home-card .hc-title{display:flex; align-items:center; gap:10px; min-width:0;}
.home-card .hc-type-icon{width:34px; height:34px; border-radius:50%; background:var(--accent-faint); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.home-card .hc-type-icon .icon{width:18px; height:18px;}
.home-card .name{font-weight:700; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.home-card .hc-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.home-card .meta{color:var(--text-dim); font-size:12.5px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border-soft); display:flex; gap:8px; flex-wrap:wrap;}
.pr-pill{background:var(--accent-grad); color:var(--accent-ink); font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:99px; white-space:nowrap;}

.streak-hero{position:relative; overflow:hidden; background:linear-gradient(135deg,#1c1815,#100e0c); border:1px solid #2a241d; border-radius:22px; padding:22px; margin:4px 0 18px;}
.streak-hero::before{content:''; position:absolute; right:-30px; top:-30px; width:180px; height:180px; background:radial-gradient(circle, rgba(255,122,26,.35), transparent 70%); pointer-events:none;}
.streak-hero .sh-flame{position:absolute; right:16px; top:18px; width:38px; height:38px; color:#ff8a3d; opacity:.95; z-index:2;}
.streak-hero .sh-flame .icon{width:38px; height:38px;}
.streak-hero .sh-num{position:relative; z-index:2; font-family:var(--font-d); font-size:32px; font-weight:700; margin:0 0 16px; color:#f5f1ec;}
.day-row{display:flex; gap:8px; position:relative; z-index:2;}
.day-circle{flex:1; aspect-ratio:1; border-radius:50%; background:#241d16; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; color:#6b6257; font-size:9px; font-weight:700;}
.day-circle .dl{font-size:8.5px; opacity:.8; text-transform:uppercase;}
.day-circle .icon{width:15px; height:15px;}
.day-circle.on{background:linear-gradient(135deg,#ffb877,#ff6a1a); color:#2a0f00;}
.day-circle.today{box-shadow:0 0 0 2.5px #ff8a3d; background:rgba(255,138,61,.16); color:#ffb877;}
.day-circle.today.on{box-shadow:0 0 0 2.5px #f5f1ec; background:linear-gradient(135deg,#ffb877,#ff6a1a); color:#2a0f00;}
.day-circle[data-action]{cursor:pointer;}
.pr-badge-row{position:relative; z-index:2; display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:#ffb877; margin-top:16px;}
.pr-badge-row .medal{display:flex; align-items:center;}
.pr-badge-row .medal .icon{width:20px; height:20px;}
.icon-btn{background:var(--surface-2); border:1px solid var(--border); width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer; flex-shrink:0;}
.icon-btn:active{background:var(--surface-3);}
.icon-btn.on{color:var(--accent); border-color:var(--accent);}

.empty{text-align:center; padding:50px 20px; color:var(--text-dim);}
.empty .icon{width:44px; height:44px; margin:0 auto 14px; color:var(--text-faint);}
.empty h3{font-size:17px; color:var(--text); margin-bottom:6px;}
.empty p{font-size:13.5px; line-height:1.5;}

.btn{
  border:none; border-radius:var(--radius-m); padding:14px 18px; font-weight:700; font-size:15px;
  cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn.primary{background:var(--accent-grad); color:var(--accent-ink);}
.btn.primary:active{filter:brightness(.92);}
.btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn.danger{background:var(--red-soft); color:var(--red);}
.btn.ghost{background:none; color:var(--text-dim); border:1px solid var(--border);}
.btn.sm{padding:10px 14px; font-size:13.5px; width:auto;}
.btn:disabled{opacity:.45;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; padding:12px 13px; font-size:15px; outline:none;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical; min-height:64px; line-height:1.4;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.hint{font-size:11.5px; color:var(--text-faint); margin-top:5px;}

.chips{display:flex; gap:8px; overflow-x:auto; padding:10px 0 12px; margin:0 -16px 6px; padding-left:16px; padding-right:16px; -ms-overflow-style:none; scrollbar-width:none; position:sticky; top:var(--topbar-h, 60px); z-index:15; background:var(--bg-solid);}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; padding:8px 15px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer; white-space:nowrap;}
.chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

.searchbar{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:11px 13px; margin-bottom:14px;}
.searchbar input{background:none; border:none; flex:1; font-size:15px; padding:0; outline:none;}
.searchbar .icon{color:var(--text-faint); flex-shrink:0;}

.seg{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:3px; margin-bottom:16px;}
.seg button{flex:1; background:none; border:none; padding:10px 6px; font-size:13.5px; font-weight:700; color:var(--text-dim); border-radius:var(--radius-s); cursor:pointer;}
.seg button.active{background:var(--accent); color:var(--accent-ink);}

.ex-lib-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:10px 13px; margin-bottom:9px; cursor:pointer;}
.ex-lib-row.selected{border-color:var(--accent); background:var(--accent-soft);}
.ex-lib-row .ex-info{flex:1; min-width:0;}
.ex-lib-row .n{font-weight:600; font-size:14.5px;}
.ex-lib-row .g{font-size:12px; color:var(--text-dim); margin-top:2px; text-transform:capitalize;}
.check-circle{width:24px; height:24px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.ex-lib-row.selected .check-circle{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.ex-thumb{width:48px; height:48px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
.ex-thumb .body-icon, .body-icon{width:100%; height:100%; display:block;}
.ex-detail-icon{width:96px; height:96px; margin:4px auto 14px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:16px; display:flex; align-items:center; justify-content:center; padding:10px;}
.ex-detail-icon .body-icon{width:100%; height:100%;}

.wk-ex-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; margin-bottom:14px;}
.wk-ex-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:10px;}
.wk-ex-head .n{font-size:16px; font-weight:600;}
.wk-ex-head .g{font-size:11.5px; color:var(--text-faint); text-transform:capitalize; margin-top:2px;}
.wk-ex-head .ctr{display:flex; gap:6px; flex-shrink:0;}
.pr-medal{color:var(--accent); flex-shrink:0; display:flex; align-items:center;}
.pr-medal .icon{width:22px; height:22px;}
.mini-btn{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s); width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer;}
.rest-chip{display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--border); border-radius:99px; padding:6px 11px; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:10px; cursor:pointer;}
.prev-line{font-size:12px; color:var(--text-faint); margin-bottom:10px;}
.notes-box{width:100%; padding:9px 11px; font-size:13px; margin-bottom:12px; min-height:40px;}
.set-grid-head{display:grid; grid-template-columns:28px 1fr 1fr 1fr 34px; gap:6px; font-size:10.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; padding:0 2px 6px; letter-spacing:.3px;}
.set-grid-head.bw{grid-template-columns:28px 1fr 1fr 34px;}
.set-swipe-wrap{position:relative; overflow:hidden; border-radius:var(--radius-s); margin-bottom:7px;}
.set-swipe-bg{position:absolute; top:0; right:0; bottom:0; width:72px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.set-swipe-bg .icon{width:20px; height:20px;}
.set-row{display:grid; grid-template-columns:28px 1fr 1fr 1fr 34px; gap:6px; align-items:center; background:var(--surface); position:relative; touch-action:pan-y;}
.set-row.bw{grid-template-columns:28px 1fr 1fr 34px;}
.set-row .idx{font-family:var(--font-d); font-size:14px; color:var(--text-dim); text-align:center;}
.set-row .prev{font-size:11.5px; color:var(--text-faint); text-align:center;}
.set-row input{width:100%; padding:9px 4px; text-align:center; font-size:14.5px; font-variant-numeric:tabular-nums;}
.set-row.done input{border-color:var(--accent);}
.set-row.done{background:var(--accent-faint-solid); border-radius:var(--radius-s);}
.set-check{width:30px; height:30px; border-radius:50%; border:2px solid var(--border); background:none; display:flex; align-items:center; justify-content:center; color:transparent; cursor:pointer; margin:0 auto;}
.set-check.done{background:var(--accent-faint); border-color:var(--accent); color:var(--accent);}
.add-set-btn{width:100%; padding:9px; border-radius:var(--radius-s); border:1.5px dashed var(--border); background:none; color:var(--text-dim); font-weight:600; font-size:13.5px; cursor:pointer; margin-top:2px; display:flex; align-items:center; justify-content:center; gap:6px; line-height:1;}

.chart-svg{width:100%; height:auto; display:block;}
.chart-empty{text-align:center; color:var(--text-faint); font-size:13px; padding:30px 0;}
.chart-label{font-size:10px; fill:var(--text-faint); font-family:var(--font-b);}
.chart-callout{font-size:15px; font-weight:700; font-family:var(--font-d);}
.bar-list{display:flex; flex-direction:column; gap:10px;}
.bar-list .row{}
.bar-list .row .top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
.bar-list .row .top .nm{font-weight:600; text-transform:capitalize;}
.bar-list .row .top .pct{color:var(--text-dim);}
.bar-track{height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
.bar-fill{height:100%; border-radius:99px; background:var(--blue);}

.pr-row{display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px; margin-bottom:9px; cursor:pointer;}
.pr-row .n{font-weight:600; font-size:14.5px;}
.pr-row .stats{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
.pr-row .stats b{color:var(--accent); font-weight:700;}

.profile-link{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; margin-bottom:10px; cursor:pointer;}
.profile-link .pl-icon{width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.profile-link .pl-body{flex:1; min-width:0;}
.profile-link .pl-title{font-weight:600; font-size:15px;}
.profile-link .pl-sub{font-size:12px; color:var(--text-dim); margin-top:2px;}

.measure-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;}

.goal-row{margin-bottom:16px;}
.goal-row:last-child{margin-bottom:0;}
.goal-row-top{display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:7px;}
.goal-row-top .gname{font-weight:600;}
.goal-row-top .gval{color:var(--text-dim); display:flex; align-items:center; gap:5px; font-variant-numeric:tabular-nums;}
.goal-row input[type="number"]{margin-top:8px;}
.goal-check{display:flex; align-items:center; gap:9px; margin-top:8px; font-size:13.5px; color:var(--text-dim);}
.goal-check input{width:18px; height:18px;}

.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.cal-month-label{font-family:var(--font-d); font-size:16px; font-weight:600;}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; color:var(--text-faint); font-weight:700; margin-bottom:8px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:16px;}
.cal-cell{height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border-radius:10px; background:var(--surface); border:1px solid var(--border); cursor:pointer; min-width:0;}
.cal-cell.cal-blank{background:none; border:none; cursor:default;}
.cal-cell.today{border-color:var(--accent); border-width:1.5px;}
.cal-daynum{font-family:var(--font-d); font-size:13px;}
.cal-dots{display:flex; gap:3px; height:6px;}
.cal-dot{width:5px; height:5px; border-radius:50%; display:inline-block;}
.cal-dot.workout{background:var(--accent);}
.cal-dot.goals{background:var(--blue);}
.cal-legend{display:flex; gap:18px; font-size:11.5px; color:var(--text-dim); margin-bottom:4px;}
.cal-legend .cal-dot{margin-right:6px;}

.lb-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border-soft);}
.lb-row:last-child{border-bottom:none;}
.lb-row .rank{font-family:var(--font-d); font-size:16px; color:var(--text-faint); width:22px;}
.lb-row.me .rank, .lb-row.me .nm{color:var(--accent);}
.lb-row .avatar{width:34px; height:34px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
.lb-row .nm{flex:1; font-weight:600; font-size:14px;}
.lb-row .val{font-family:var(--font-d); font-size:14.5px; color:var(--text-dim); font-variant-numeric:tabular-nums;}

.settings-row{display:flex; align-items:center; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--border-soft);}
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-size:14.5px; font-weight:500;}
.toggle{width:48px; height:28px; border-radius:99px; background:var(--surface-3); border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0;}
.toggle::after{content:'';position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--text-dim); transition:transform .18s ease;}
.toggle.on{background:var(--accent-soft); border-color:var(--accent);}
.toggle.on::after{transform:translateX(20px); background:var(--accent);}

.history-item{display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 14px; margin-bottom:8px;}
.history-item .v{font-family:var(--font-d); font-size:16px;}
.history-item .d{font-size:12px; color:var(--text-dim);}
.history-item .acts{display:flex; gap:6px;}

/* modal */
#modal-root{position:fixed; inset:0; z-index:100; pointer-events:none;}
.modal-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.55); opacity:0; transition:opacity .18s ease; pointer-events:none;}
.modal-backdrop.open{opacity:1; pointer-events:auto;}
.sheet{position:absolute; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--modal-bg); border-radius:20px 20px 0 0; border:1px solid var(--border); border-bottom:none; padding:18px 18px calc(var(--safe-b) + 18px); transform:translateY(100%); transition:transform .22s ease; pointer-events:auto; max-height:88vh; overflow-y:auto; display:flex; flex-direction:column;}
.sheet-scroll{overflow-y:auto; flex:1; min-height:0;}
.sheet-footer{flex-shrink:0;}
.sheet.open{transform:translateY(0);}
.sheet .handle{width:100%; height:32px; margin:-10px 0 4px; display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none;}
.sheet .handle::before{content:''; width:36px; height:4px; border-radius:99px; background:var(--border);}
.sheet h3{font-size:18px; margin-bottom:4px;}
.sheet .sub{color:var(--text-dim); font-size:13px; margin-bottom:16px;}

.toast-wrap{position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); max-width:480px; margin:0 auto; display:flex; justify-content:center; z-index:200; pointer-events:none; padding:0 20px;}
.toast{background:var(--modal-bg); border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:99px; font-size:13.5px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; transform:translateY(6px); transition:all .18s ease;}
.toast.show{opacity:1; transform:translateY(0);}

/* Sync status dot — only visible when something is waiting to reach the server,
   so a normal synced session shows no chrome at all. */
#sync-dot{position:fixed; top:calc(var(--safe-t, 0px) + 8px); right:10px; width:8px; height:8px;
  border-radius:50%; z-index:250; pointer-events:none; transition:opacity .2s ease, background .2s ease;}
#sync-dot.sync-synced{opacity:0; background:transparent;}
#sync-dot.sync-pending{opacity:1; background:#ffab5e; box-shadow:0 0 0 3px rgba(255,171,94,.18);}
#sync-dot.sync-error{opacity:1; background:#ff6b5e; box-shadow:0 0 0 3px rgba(255,107,94,.18);}

.photo-preview{width:100%; border-radius:var(--radius-m); margin-bottom:12px; display:block; max-height:280px; object-fit:cover;}
.photo-drop{border:1.5px dashed var(--border); border-radius:var(--radius-m); padding:26px; text-align:center; color:var(--text-dim); cursor:pointer; font-size:13.5px;}
.photo-drop .icon{width:30px;height:30px;margin:0 auto 8px;}

.share-card-preview{width:100%; border-radius:var(--radius-m); border:1px solid var(--border); margin-bottom:14px;}
.tag-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.tag{background:var(--surface-2); border:1px solid var(--border); border-radius:99px; padding:7px 12px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px;}
.tag button{background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; padding:0;}

.demo-flag{font-size:11px; color:var(--text-faint); text-align:center; margin-top:10px; font-style:italic;}

.gate-wrap{padding-top:calc(var(--safe-t) + 28px); max-width:440px; margin:0 auto;}
.gate-logo{display:flex; justify-content:center; margin-bottom:14px;}
.check-row{display:flex; align-items:flex-start; gap:10px; font-size:13px; color:var(--text-dim); margin-bottom:14px; cursor:pointer; line-height:1.4;}
.check-row input{width:18px; height:18px; margin-top:1px; flex-shrink:0;}
.check-row b{color:var(--text); font-weight:600;}
.check-row.muted{font-size:11.5px; color:var(--text-faint);}
.check-row.muted input{width:16px; height:16px;}

.select-btn{width:100%; padding:12px 13px; font-size:15px; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s); color:var(--text); display:flex; align-items:center; justify-content:space-between; cursor:pointer; font-family:inherit;}
.select-btn.placeholder{color:var(--text-faint);}
.select-btn .chevron-down{transform:rotate(90deg); color:var(--text-faint); flex-shrink:0;}
.dob-row{display:flex; gap:8px;}
.dob-row .select-btn{flex:1; padding-left:10px; padding-right:8px;}
.trend-summary{border-top:1px solid var(--border-soft); margin-top:14px; padding-top:12px;}
.ts-row{display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:13.5px; color:var(--text-dim);}
.ts-row b{font-family:var(--font-d); font-size:14.5px; color:var(--text);}
.select-list{max-height:52vh; overflow-y:auto; margin-top:6px;}
.select-option{width:100%; text-align:left; padding:13px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); margin-bottom:8px; color:var(--text); display:flex; align-items:center; justify-content:space-between; cursor:pointer; font-size:14.5px; font-family:inherit;}
.select-option.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600;}

.wheel-row{display:flex; gap:20px; justify-content:center; margin:16px 0 4px;}
.wheel-stack{position:relative; width:76px;}
.wheel-highlight{position:absolute; left:0; right:0; top:88px; height:44px; border-top:1.5px solid var(--accent); border-bottom:1.5px solid var(--accent); background:var(--accent-faint); border-radius:8px; pointer-events:none; z-index:0;}
.wheel-col{position:relative; z-index:1; height:220px; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
.wheel-col::-webkit-scrollbar{display:none;}
.wheel-item, .wheel-spacer{height:44px; display:flex; align-items:center; justify-content:center; scroll-snap-align:center; font-family:var(--font-d); font-size:19px;}
.wheel-item{color:var(--text); font-weight:600;}
.wheel-labels{display:flex; gap:20px; justify-content:center;}
.wheel-labels span{width:76px; text-align:center; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px;}
.progress-photo-thumb{width:100%; border-radius:var(--radius-m); margin:12px 0; display:block;}
.divider{height:1px; background:var(--border-soft); margin:18px 0;}
</style>
</head>

<script>
(function(){
"use strict";

/* ============================================================================
   ICONS
============================================================================ */
const ICONS = {
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',

};
function ic(name, cls){return ICONS[name] ? ICONS[name].replace('<svg ', `<svg class="icon ${cls||''}" `) : '';}

/* ============================================================================
   MUSCLE / CARDIO ICON (simplified body silhouette with target region highlighted)
============================================================================ */
let _muscleIconSeq = 0;
function muscleIcon(muscleGroup, size){
  size = size || 44;
  if(muscleGroup==='cardio'){
    return `<svg viewBox="0 0 100 200" width="${size}" height="${size}" class="body-icon">
      <path d="M50 146 C 28 124 22 96 29 79 C 34 68 45 69 50 80 C 55 69 66 68 71 79 C 78 96 72 124 50 146 Z" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    </svg>`;
  }
  const gid = 'mg' + (_muscleIconSeq++);
  const grey = `url(#${gid})`;
  const hi = 'var(--accent)';
  const body = `
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--text-dim)"/><stop offset="1" stop-color="var(--text-faint)"/></linearGradient></defs>
    <ellipse cx="50" cy="15" rx="8.5" ry="10" fill="${grey}"/>
    <path d="M44,24 L44,30 Q50,33 56,30 L56,24 Z" fill="${grey}"/>
    <path d="M24,34 Q17,37 18,44 L23,68 Q26,78 34,83 L31,90 L69,90 L66,83 Q74,78 77,68 L82,44 Q83,37 76,34 Q62,29 50,29 Q38,29 24,34 Z" fill="${grey}"/>
    <path d="M21,36 Q10,41 9,52 L8,76 Q8,85 13,92 L23,89 Q19,82 20,74 L21,50 Q22,42 27,37 Z" fill="${grey}"/>
    <path d="M79,36 Q90,41 91,52 L92,76 Q92,85 87,92 L77,89 Q81,82 80,74 L79,50 Q78,42 73,37 Z" fill="${grey}"/>
    <path d="M35,91 Q30,112 33,132 Q31,150 35,168 L46,168 Q44,150 45,132 Q47,112 46,92 Z" fill="${grey}"/>
    <path d="M65,91 Q70,112 67,132 Q69,150 65,168 L54,168 Q56,150 55,132 Q53,112 54,92 Z" fill="${grey}"/>`;
  let overlay = '';
  switch(muscleGroup){
    case 'chest':
      overlay = `<path d="M26,38 Q18,44 21,54 Q24,62 35,64 Q40,58 38,48 Q36,40 30,36 Z" fill="${hi}"/>

/* ============================================================================
   HELPERS
============================================================================ */
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function num(v,d){ const n=parseFloat(v); return isFinite(n) ? n : (d===undefined?0:d); }
function epley1RM(w,r){ if(!w||!r) return 0; return r<=1 ? w : w*(1+r/30); }
function round1(n){ return Math.round(n*10)/10; }

function fmtDateShort(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function fmtDateLong(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
function fmtDateISO(iso){ return new Date(iso).toISOString().slice(0,10); }
function todayISODate(){ return new Date().toISOString().slice(0,10); }
function fmtClock(iso){ return new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(h>0) return `${h}h ${m}m`;
  if(m>0) return `${m}m ${s}s`;
  return `${s}s`;
}
function fmtClockCount(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function fmtRest(sec){
  if(sec>=60){ const m=Math.floor(sec/60), s=sec%60; return s? `${m}m ${s}s` : `${m}m`; }
  return `${sec}s`;
}
function typeLabel(type){
  if(type==='bodyweight') return 'bodyweight';
  if(type==='cardio') return 'cardio';
  return 'weighted';
}
function startOfISOWeek(d){
  const dt = new Date(d);
  const day = (dt.getDay()+6)%7; // Mon=0
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()-day);
  return dt;
}
function cv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#4f9dff'; }

  goals: { calories:null, protein:null, water:null, steps:null, supplements:false }, dailyLogs: [],

  exercises: ()=>DEFAULT_EXERCISES.map(e=>({...e})),
  templates: ()=>[], history: ()=>[], activeWorkout: ()=>null,
  bodyweight: ()=>[], measurementFields: ()=>DEFAULT_MEASUREMENT_FIELDS.map(f=>({...f})), measurements: ()=>[],

  settings: ()=>({theme:'light'}), account: ()=>null

const LS_PREFIX = 'overload:';
const STATE_KEYS = ['exercises','templates','history','activeWorkout','bodyweight','measurementFields','measurements','goals','dailyLogs','settings','account'];

/* ============================================================================
   PERSISTENCE — local-first, synced to Supabase
   ----------------------------------------------------------------------------
   Every write lands in localStorage synchronously first, then pushes to
   Supabase in the background. That ordering is deliberate: this is a gym app,
   and gyms have terrible signal. A set you tick off must never be lost to a
   failed request, so the network is treated as a replica, not the source of
   truth for the in-progress session.

   Keys that fail to push are held in a persisted `dirty` set and retried on
   reconnect, on app resume, and on a timer. On load, a dirty key's local copy
   always wins over whatever the server has, so unsynced offline work is never
   clobbered by stale server data.
============================================================================ */
const CFG = window.OVERLOAD_CONFIG || {};
const CLOUD_ENABLED = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) && !CFG.OFFLINE_ONLY;

let sb = null;
if(CLOUD_ENABLED){
  try{
    sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
      auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
    });
  }catch(e){
    console.error('Supabase client failed to initialise — running local-only.', e);
  }
}

let session = null;
function userId(){ return (session && session.user && session.user.id) || null; }
function cloudReady(){ return !!(sb && userId()); }

// Cache is namespaced per account, so two people signing in on the same phone
// can't read each other's cached data.
function lsKey(key){
  const u = userId();
  return LS_PREFIX + (u ? u+':' : '') + key;
}
function readLocal(key){
  try{
    const raw = localStorage.getItem(lsKey(key));
    return raw===null ? undefined : JSON.parse(raw);
  }catch(e){ return undefined; }
}

/* ---- pending-write tracking (survives a reload / app kill) ---- */
const dirty = new Set();
function dirtyStoreKey(){ const u = userId(); return LS_PREFIX + (u ? u+':' : '') + '__dirty'; }
function loadDirty(){
  dirty.clear();
  try{
    const raw = localStorage.getItem(dirtyStoreKey());
    if(raw) JSON.parse(raw).forEach(k=>dirty.add(k));
  }catch(e){ /* corrupt marker — safe to ignore, worst case we re-push */ }
}
function persistDirty(){
  try{ localStorage.setItem(dirtyStoreKey(), JSON.stringify([...dirty])); }catch(e){}
}

/* ---- sync status indicator ---- */
let syncState = 'synced';
function setSyncStatus(s){
  if(syncState===s) return;
  syncState = s;
  let el = document.getElementById('sync-dot');
  if(!el){
    el = document.createElement('div');
    el.id = 'sync-dot';
    document.body.appendChild(el);
  }
  el.className = 'sync-'+s;
  el.title = s==='pending' ? 'Changes saved on this device, waiting to sync'
           : s==='error'   ? 'Could not reach the server — changes are saved locally'
           : 'All changes synced';
}

async function fetchCloudState(){
  if(!cloudReady()) return null;
  try{
    const { data, error } = await sb.from('user_state').select('key,value').eq('owner_id', userId());
    if(error) throw error;
    const out = {};
    for(const row of (data||[])) out[row.key] = row.value;
    return out;
  }catch(e){
    console.warn('Could not load from server, using local cache.', e.message||e);
    setSyncStatus('error');
    return null;
  }
}

async function pushKey(key){
  if(!cloudReady()) return false;
  try{
    const { error } = await sb.from('user_state')
      .upsert({ owner_id:userId(), key, value: state[key]===undefined ? null : state[key] },
              { onConflict:'owner_id,key' });
    if(error) throw error;
    dirty.delete(key); persistDirty();
    if(dirty.size===0) setSyncStatus('synced');
    return true;
  }catch(e){
    console.warn('Sync pending for "'+key+'":', e.message||e);
    setSyncStatus('pending');
    scheduleFlush();
    return false;
  }
}

async function flushDirty(){
  if(!cloudReady() || dirty.size===0) return;
  for(const key of [...dirty]) await pushKey(key);
}

let flushTimer = null;
function scheduleFlush(delay){
  clearTimeout(flushTimer);
  flushTimer = setTimeout(()=>{ flushTimer=null; flushDirty(); }, delay||15000);
}

async function loadState(){
  loadDirty();
  const cloud = await fetchCloudState();
  for(const k of STATE_KEYS){
    let v;
    if(dirty.has(k)){
      // Unsynced local work beats the server copy.
      v = readLocal(k);
    }else if(cloud && Object.prototype.hasOwnProperty.call(cloud, k)){
      v = cloud[k];
      try{ localStorage.setItem(lsKey(k), JSON.stringify(v)); }catch(e){}
    }else{
      v = readLocal(k);
    }
    // Fall back to the default when nothing was stored. `null` is a real value
    // for activeWorkout/account (whose defaults are null too), so only treat it
    // as missing when the default says otherwise.
    const fallback = DEFAULTS[k]();
    state[k] = (v===undefined || (v===null && fallback!==null)) ? fallback : v;
  }
  if(!Array.isArray(state.exercises) || state.exercises.length===0){
    state.exercises = DEFAULTS.exercises();
  }
  if(!Array.isArray(state.measurementFields) || state.measurementFields.length===0){
    state.measurementFields = DEFAULTS.measurementFields();
    saveKey('measurementFields');
  }
  if(!state.settings || !state.settings.theme) state.settings = DEFAULTS.settings();
  if(!state.goals || typeof state.goals!=='object') state.goals = DEFAULTS.goals();
  if(!Array.isArray(state.dailyLogs)) state.dailyLogs = [];
  migrateBodyweight();
}
function migrateBodyweight(){
  if(!Array.isArray(state.bodyweight) || state.bodyweight.length===0) return;
  for(const e of state.bodyweight){
    let entry = state.measurements.find(m=>m.date===e.date);
    if(!entry){ entry = {id:uid(), date:e.date, values:{}}; state.measurements.push(entry); }
    if(entry.values.bw==null) entry.values.bw = e.weight;
  }
  state.bodyweight = [];
  saveKey('measurements');
  saveKey('bodyweight');
}

async function saveKey(key){
  // Local write first and synchronously — this is the write that must not fail.
  try{
    localStorage.setItem(lsKey(key), JSON.stringify(state[key]));
  }catch(e){
    console.error('Storage error saving', key, e);
    showToast('Could not save — changes may be lost');
    return;
  }
  if(!cloudReady()) return;
  dirty.add(key); persistDirty();
  setSyncStatus('pending');
  await pushKey(key);
}

async function deleteKeySafe(key){
  try{ localStorage.removeItem(lsKey(key)); }catch(e){ /* ignore missing key */ }
  dirty.delete(key); persistDirty();
  if(!cloudReady()) return;
  try{
    const { error } = await sb.from('user_state').delete()
      .eq('owner_id', userId()).eq('key', key);
    if(error) throw error;
  }catch(e){
    console.warn('Cloud delete failed for "'+key+'":', e.message||e);
  }
}

let saveTimers = {};
function debouncedSave(key, delay){
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(()=>saveKey(key), delay||500);
}

// Retry unsynced writes whenever we plausibly have connectivity again.
window.addEventListener('online', ()=>flushDirty());
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) flushDirty(); });

/* ============================================================================
   COMPUTED HELPERS: streak, week count, bests, PRs
============================================================================ */
function uniqueWorkoutDates(){
  const set = new Set(state.history.map(w=>fmtDateISO(w.startTime)));
  return set;
}
function getStreak(){
  const dates = uniqueWorkoutDates();
  if(dates.size===0) return 0;
  let d = new Date(); d.setHours(0,0,0,0);
  const todayKey = d.toISOString().slice(0,10);
  if(!dates.has(todayKey)){
    d.setDate(d.getDate()-1);
  }
  let streak=0;
  while(true){
    const key = d.toISOString().slice(0,10);
    if(dates.has(key)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
function getWeekStreak(){
  const weeksWithActivity = new Set(state.history.map(w=>startOfISOWeek(new Date(w.startTime)).getTime()));
  if(weeksWithActivity.size===0) return 0;
  let d = startOfISOWeek(new Date());
  const thisWeekKey = d.getTime();
  if(!weeksWithActivity.has(thisWeekKey)){
    d.setDate(d.getDate()-7); // current week not yet active; don't count it as a break, start checking from last week
  }
  let streak=0;
  while(true){
    const key = d.getTime();
    if(weeksWithActivity.has(key)){ streak++; d.setDate(d.getDate()-7); }
    else break;
  }
  return streak;
}
function getWeekActivityMap(){
  // Returns 7 entries for a rolling window ending today (today is always last): {type:'lift'|'cardio'|null, workoutId:string|null, dow:string}
  const dowLetters = ['S','M','T','W','T','F','S']; // indexed by Date.getDay(): 0=Sun..6=Sat
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=6;i>=0;i--){
    const dayStart = new Date(today); dayStart.setDate(today.getDate()-i);
    const dayKey = fmtDateISO(dayStart);
    const dayWorkouts = state.history.filter(w=>fmtDateISO(w.startTime)===dayKey);
    let type = null, workoutId = null;
    if(dayWorkouts.length){
      const sortedByTime = [...dayWorkouts].sort((a,b)=>new Date(a.startTime)-new Date(b.startTime));
      const firstWorkout = sortedByTime[0];
      workoutId = firstWorkout.id;
      const firstExercise = firstWorkout.exercises[0];
      if(firstExercise) type = firstExercise.type==='cardio' ? 'cardio' : 'lift';
    }
    days.push({type, workoutId, isToday: i===0, dow: dowLetters[dayStart.getDay()]});
  }
  return days;
}
function getWeekPRCount(){
  const start = startOfISOWeek(new Date());
  return state.history.filter(w=>new Date(w.startTime) >= start).reduce((sum,w)=>sum+(w.prs?w.prs.length:0),0);
}
function getBests(exerciseId, historyList){
  let maxWeight=0,max1rm=0,maxVolume=0,maxReps=0,maxDuration=0,maxDistance=0;
  for(const w of historyList){
    const ex = w.exercises.find(e=>e.exerciseId===exerciseId);
    if(!ex) continue;
    for(const s of ex.sets){
      if(!s.completed) continue;
      if(ex.type==='cardio'){
        if((s.duration||0) > maxDuration) maxDuration = s.duration;
        if((s.distance||0) > maxDistance) maxDistance = s.distance;
      } else if(ex.type==='bodyweight'){
        if((s.reps||0) > maxReps) maxReps = s.reps;
      } else {
        const w1 = s.weight||0, r = s.reps||0;
        if(w1 > maxWeight) maxWeight = w1;
        const orm = epley1RM(w1,r);
        if(orm > max1rm) max1rm = orm;
        const vol = w1*r;
        if(vol > maxVolume) maxVolume = vol;
      }
    }
  }
  return {maxWeight,max1rm:round1(max1rm),maxVolume,maxReps,maxDuration,maxDistance};
}
function computeSessionPRs(workout, historyBefore){
  const prs=[];
  for(const ex of workout.exercises){
    const bests = getBests(ex.exerciseId, historyBefore);
    let sw=bests.maxWeight, s1=bests.max1rm, sv=bests.maxVolume, sr=bests.maxReps, sd=bests.maxDuration, sdist=bests.maxDistance;
    let prW=null, pr1=null, prV=null, prR=null, prD=null, prDist=null;
    for(const s of ex.sets){
      if(!s.completed) continue;
      if(ex.type==='cardio'){
        if((s.duration||0) > sd){ sd=s.duration; prD=s.duration; }
        if((s.distance||0) > sdist){ sdist=s.distance; prDist=s.distance; }
      } else if(ex.type==='bodyweight'){
        if((s.reps||0) > sr){ sr=s.reps; prR=s.reps; }
      } else {
        const w1=s.weight||0, r=s.reps||0;
        if(w1 > sw){ sw=w1; prW=w1; }
        const orm = epley1RM(w1,r);
        if(orm > s1){ s1=orm; pr1=orm; }
        const vol = w1*r;
        if(vol > sv){ sv=vol; prV=vol; }
      }
    }
    if(prW!=null) prs.push({exerciseId:ex.exerciseId, exerciseName:ex.name, type:'weight', value:prW});
    if(pr1!=null) prs.push({exerciseId:ex.exerciseId, exerciseName:ex.name, type:'1rm', value:round1(pr1)});
    if(prV!=null) prs.push({exerciseId:ex.exerciseId, exerciseName:ex.name, type:'volume', value:prV});
    if(prR!=null) prs.push({exerciseId:ex.exerciseId, exerciseName:ex.name, type:'reps', value:prR});
    if(prD!=null) prs.push({exerciseId:ex.exerciseId, exerciseName:ex.name, type:'duration', value:prD});
    if(prDist!=null) prs.push({exerciseId:ex.exerciseId, exerciseName:ex.name, type:'distance', value:prDist});
  }
  return prs;
}
function workoutVolume(workout){
  let vol=0;
  for(const ex of workout.exercises){
    if(ex.type!=='weighted') continue;
    for(const s of ex.sets){ if(s.completed) vol += (s.weight||0)*(s.reps||0); }
  }
  return vol;
}
function workoutStatLabel(w){
  // Returns {value, label} for the workout's headline third stat, choosing units
  // that actually make sense for what was logged (kg volume only when there's real
  // weighted-lift volume; distance for cardio; reps for bodyweight-only; else null).
  const hasWeighted = w.exercises.some(ex=>ex.type==='weighted');
  if(hasWeighted) return {value: String(Math.round(w.totalVolume)), label:'Volume kg'};
  const hasCardio = w.exercises.some(ex=>ex.type==='cardio');
  if(hasCardio){
    let totalDist = 0, hasDist = false;
    w.exercises.forEach(ex=>{ if(ex.type==='cardio'){ ex.sets.forEach(s=>{ if(s.completed && s.distance){ totalDist += s.distance; hasDist = true; } }); } });
    if(hasDist) return {value: String(round1(totalDist)), label:'Distance km'};
    let totalMin = 0;
    w.exercises.forEach(ex=>{ if(ex.type==='cardio'){ ex.sets.forEach(s=>{ if(s.completed && s.duration){ totalMin += s.duration; } }); } });
    return totalMin>0 ? {value: String(Math.round(totalMin)), label:'Cardio min'} : null;
  }
  let totalReps = 0;
  w.exercises.forEach(ex=>{ if(ex.type==='bodyweight'){ ex.sets.forEach(s=>{ if(s.completed) totalReps += (s.reps||0); }); } });
  return totalReps>0 ? {value: String(totalReps), label:'Reps'} : null;
}
function workoutStatInline(w){
  // Same data as workoutStatLabel, flattened to a short inline string for feed rows.
  const s = workoutStatLabel(w);
  if(!s) return null;
  if(s.label==='Volume kg') return `${s.value} kg vol`;
  if(s.label==='Distance km') return `${s.value} km`;
  if(s.label==='Cardio min') return `${s.value} min cardio`;
  return `${s.value} reps`;
}
function getLastPerformance(exerciseId, beforeWorkoutId){
  for(const w of state.history){
    if(w.id===beforeWorkoutId) continue;
    const ex = w.exercises.find(e=>e.exerciseId===exerciseId);
    if(ex && ex.sets.some(s=>s.completed)) return ex;
  }
  return null;
}
function getExercise(id){ return state.exercises.find(e=>e.id===id); }

/* ============================================================================
   CHARTS (pure SVG)
============================================================================ */
function buildLineChart(points, opts){
  opts = opts||{};
  const width=opts.width||320, height=opts.height||180, pad=30;
  if(!points || points.length===0) return `<div class="chart-empty">Not enough data yet</div>`;
  if(points.length===1) points = [points[0], points[0]];
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
  let minY=Math.min(...ys), maxY=Math.max(...ys);
  if(minY===maxY){ minY-=1; maxY+=1; }
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const xRange=(maxX-minX)||1, yRange=(maxY-minY)||1;
  const w=width-pad*2, h=height-pad*2-14;
  const top = pad+18;
  const coords = points.map(p=>[ pad+((p.x-minX)/xRange)*w, top+h-((p.y-minY)/yRange)*h ]);
  function smoothPath(pts){
    if(pts.length<3) return pts.map((c,i)=>`${i===0?'M':'L'}${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(' ');
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)} `;
    for(let i=0;i<pts.length-1;i++){
      const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
      const cp1x = p1[0] + (p2[0]-p0[0])/6, cp1y = p1[1] + (p2[1]-p0[1])/6;
      const cp2x = p2[0] - (p3[0]-p1[0])/6, cp2y = p2[1] - (p3[1]-p1[1])/6;
      d += `C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)} `;
    }
    return d.trim();
  }
  const path = smoothPath(coords);
  const areaPath = path + ` L${coords[coords.length-1][0].toFixed(1)},${(top+h).toFixed(1)} L${coords[0][0].toFixed(1)},${(top+h).toFixed(1)} Z`;
  const fmt = opts.yFmt || (v=>Math.round(v));
  const gid = 'lg'+Math.random().toString(36).slice(2,9);
  const c1 = opts.colorStart || opts.color || cv('--blue');
  const c2 = opts.colorEnd || opts.color || cv('--accent');
  const dots = coords.map((c,i)=>{
    const isEnd = i===0||i===coords.length-1;
    const clickable = opts.pointAction && points[i].id;
    return `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${isEnd?5:(clickable?5:3)}" fill="${i===0?c1:(i===coords.length-1?c2:'var(--surface)')}" stroke="${i===0?c1:(i===coords.length-1?c2:cv('--border'))}" stroke-width="2" ${clickable?`data-action="${opts.pointAction}:${points[i].id}" style="cursor:pointer;"`:''}/>`;
  }).join('');
  const labelY0 = Math.max(14, coords[0][1]-14);
  const labelY1 = Math.max(14, coords[coords.length-1][1]-14);
  return `<svg viewBox="0 0 ${width} ${height}" class="chart-svg" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="${areaPath}" fill="url(#${gid})" opacity="0.10"/>
    <line x1="${pad}" y1="${(top+h).toFixed(1)}" x2="${pad+w}" y2="${(top+h).toFixed(1)}" stroke="${cv('--border')}" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="url(#${gid})" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${coords[0][0].toFixed(1)}" y="${labelY0.toFixed(1)}" class="chart-callout" text-anchor="start" fill="${c1}">${esc(fmt(ys[0]))}</text>
    <text x="${coords[coords.length-1][0].toFixed(1)}" y="${labelY1.toFixed(1)}" class="chart-callout" text-anchor="end" fill="${c2}">${esc(fmt(ys[ys.length-1]))}</text>
  </svg>`;
}
function buildBarChart(bars, opts){
  opts = opts||{};
  const width=opts.width||320, height=opts.height||150, color=opts.color||cv('--blue'), pad=26, gap=8;
  if(!bars || bars.length===0) return `<div class="chart-empty">Not enough data yet</div>`;
  const maxV = Math.max(...bars.map(b=>b.v), 1);
  const w=width-pad*2, h=height-pad*2;
  const bw = (w-gap*(bars.length-1))/bars.length;
  const fmt = opts.yFmt || (v=>Math.round(v));
  let rects='', labels='';
  bars.forEach((b,i)=>{
    const bh = Math.max(2,(b.v/maxV)*h);
    const x = pad + i*(bw+gap);
    const y = pad+h-bh;
    rects += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${color}"/>`;
    labels += `<text x="${(x+bw/2).toFixed(1)}" y="${height-6}" text-anchor="middle" class="chart-label">${esc(b.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" class="chart-svg" preserveAspectRatio="none">
    <line x1="${pad}" y1="${pad+h}" x2="${pad+w}" y2="${pad+h}" stroke="${cv('--border')}" stroke-width="1"/>
    ${rects}
    <text x="${pad}" y="${pad-8}" class="chart-label">${esc(fmt(maxV))}</text>
    ${labels}
  </svg>`;
}

function render(){
  // 'reset' wins over a present account: arriving via a password-reset link
  // signs you in, so without this the app would skip straight past the form
  // that lets you actually set the new password.
  if(state.authMode==='reset' || !state.account){ renderGate(); return; }
  renderTopbar();
  renderScreenBody();
  renderBottomNav();
  renderRestBar();
  const tb = document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--topbar-h', tb.getBoundingClientRect().height+'px');
}
function renderGate(){
  document.getElementById('topbar-slot').innerHTML = '';
  document.getElementById('bottom-nav').style.display = 'none';
  document.getElementById('rest-bar').classList.add('hidden');
  const screen = document.getElementById('screen');
  screen.classList.add('no-nav-pad');
  screen.innerHTML = state.authMode==='login'   ? viewLogin()
                   : state.authMode==='confirm' ? viewConfirmEmail()
                   : state.authMode==='reset'   ? viewResetPassword()
                   : viewRegistration();
}
function renderBottomNav(){
  const nav = document.getElementById('bottom-nav');
  const hide = state.stack.length>0;
  nav.style.display = hide ? 'none' : 'flex';
  [...nav.children].forEach(btn=>{
    const t = btn.getAttribute('data-action').split(':')[1];
    btn.classList.toggle('active', t===state.tab && !hide);
  });
  document.getElementById('screen').classList.toggle('no-nav-pad', hide);
}

function screenTitle(){
  const t = top();

    return ({

      exercisePicker: 'Add Exercises',

function renderRestBar(){
  const bar = document.getElementById('rest-bar');
  const timer = state.activeWorkout && state.activeWorkout.restTimer;
  if(!timer){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
  const remaining = Math.max(0, Math.round((timer.endsAt - Date.now())/1000));
  bar.classList.remove('hidden');
  bar.innerHTML = `
    <div class="info"><b>Resting · ${esc(timer.exerciseName)}</b><span class="time" id="rest-time">${fmtClockCount(remaining)}</span></div>
    <div class="btns">
      <button data-action="rest-sub15">-15s</button>
      <button data-action="rest-add15">+15s</button>
      <button data-action="rest-skip">Skip</button>
    </div>`;
}
function adjustRestTimer(deltaSeconds){
  const timer = state.activeWorkout && state.activeWorkout.restTimer;
  if(!timer) return;
  const now = Date.now();
  timer.endsAt = Math.max(now, timer.endsAt + deltaSeconds*1000);
  saveKey('activeWorkout');
  const remaining = Math.max(0, Math.round((timer.endsAt - now)/1000));
  const timeEl = document.getElementById('rest-time');
  if(timeEl) timeEl.textContent = fmtClockCount(remaining);
}
function skipRestTimer(){
  if(!state.activeWorkout) return;
  state.activeWorkout.restTimer = null;
  saveKey('activeWorkout');
  renderRestBar();
}

/* ============================================================================
   AUTH
   ----------------------------------------------------------------------------
   `state.account` is what gates the app (see render()). With cloud mode on, the
   Supabase session is the real authority and the account blob is profile data
   riding alongside it. In local-only mode the account blob is all there is, and
   these functions fall back to the app's original offline behaviour.
============================================================================ */
let pendingConfirmEmail = null;

// Supabase's messages are mostly fine to show verbatim; these few are worth
// rewriting because the raw wording sends people down the wrong path.
function authError(e){
  const m = (e && (e.message || e.error_description)) || 'Something went wrong';
  if(/Invalid login credentials/i.test(m)) return 'Email or password is incorrect';
  if(/Email not confirmed/i.test(m))      return 'Confirm your email first — check your inbox';
  if(/User already registered/i.test(m))  return 'That email already has an account — try signing in';
  if(/rate limit|too many/i.test(m))      return 'Too many attempts — wait a minute and try again';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'No connection — check your internet and try again';
  return m;
}

// Toggles the submit button in place rather than re-rendering the gate, so the
// user's typed email and password survive a failed attempt.
function setAuthBusy(busy, busyLabel){
  state.authBusy = busy;
  const btn = document.querySelector('.gate-wrap .btn.primary[data-action^="submit-"]');
  if(!btn) return;
  btn.disabled = busy;
  if(busy){
    if(!btn.dataset.idleLabel) btn.dataset.idleLabel = btn.textContent;
    btn.textContent = busyLabel || 'Please wait…';
  }else if(btn.dataset.idleLabel){
    btn.textContent = btn.dataset.idleLabel;
  }
}

async function recordStartingWeight(weight){
  const dateISO = todayISODate();
  let entry = state.measurements.find(m=>m.date===dateISO);
  if(!entry){ entry = {id:uid(), date:dateISO, values:{}}; state.measurements.push(entry); }
  if(entry.values.bw==null) entry.values.bw = weight;
  await saveKey('measurements');
}

// Shared tail for both registration and login: pull this account's data down,
// make sure a profile exists, then enter the app.
async function afterSignIn(newAccountFields, startingWeight){
  await loadState();

  if(newAccountFields){
    state.account = newAccountFields;
    await saveKey('account');
    if(startingWeight!=null) await recordStartingWeight(startingWeight);
  }else if(!state.account){
    // Signed in with no profile blob — e.g. the confirmation link was opened on
    // a different device. Synthesise a minimal profile so the gate lets them in
    // instead of trapping them on the registration screen.
    const u = (session && session.user) || {};
    const meta = u.user_metadata || {};
    state.account = {
      name: meta.name || (u.email||'').split('@')[0] || 'Athlete',
      email: u.email || null,
      dob:null, sex:null, height:null, goal:null,
      marketingOptIn: !!meta.marketing_opt_in,
      createdAt: u.created_at || new Date().toISOString()
    };
    await saveKey('account');
  }

  document.documentElement.setAttribute('data-theme', state.settings.theme||'light');
  try{ localStorage.setItem(LS_PREFIX+'__seen','1'); }catch(e){}
  state.authBusy = false;
  state.authMode = 'register';
  state.tab = 'home'; state.stack = [];
  if(state.activeWorkout && !state.activeWorkout.backdated) startTickers();
  showToast(`Welcome, ${(state.account.name||'').split(' ')[0] || 'back'}`);
  render();
  flushDirty();
}

async function submitLogin(){
  if(state.authBusy) return;
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if(!email || !isValidEmail(email)){ showToast('Enter a valid email address'); return; }
  if(!password){ showToast('Enter your password'); return; }
  if(!sb){ showToast('Cloud mode is off — there are no accounts to sign in to'); return; }

  setAuthBusy(true, 'Signing in…');
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    session = data.session;
    await afterSignIn(null, null);
  }catch(e){
    setAuthBusy(false);
    showToast(authError(e));
  }
}

async function forgotPassword(){
  if(!sb){ showToast('Cloud mode is off'); return; }
  const el = document.getElementById('login-email');
  promptDialog('Reset password', 'We\'ll email you a link to set a new one.', el ? el.value.trim() : '', async (val)=>{
    const email = (val||'').trim();
    if(!email || !isValidEmail(email)){ showToast('Enter a valid email address'); return; }
    try{

        redirectTo: window.location.origin + window.location.pathname
      });
      if(error) throw error;
      showToast('Reset link sent — check your email');
    }catch(e){ showToast(authError(e)); }
  }, { type:'email', inputmode:'email' });
}

async function submitResetPassword(){

async function resendConfirmation(){

    if(error) throw error;

async function submitRegistration(){
  if(state.authBusy) return;
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const confirm = document.getElementById('reg-confirm').value;
  const terms = document.getElementById('reg-terms').checked;
  const marketing = document.getElementById('reg-marketing').checked;
  const dobDay = document.getElementById('reg-dob-day-btn').dataset.value;
  const dobMonth = document.getElementById('reg-dob-month-btn').dataset.value;
  const dobYear = document.getElementById('reg-dob-year-btn').dataset.value;
  const dob = (dobDay && dobMonth && dobYear) ? `${dobYear}-${String(dobMonth).padStart(2,'0')}-${String(dobDay).padStart(2,'0')}` : null;
  const sex = document.getElementById('reg-sex-btn').dataset.value || null;
  const height = document.getElementById('reg-height').value ? num(document.getElementById('reg-height').value,null) : null;
  const weight = document.getElementById('reg-weight').value ? num(document.getElementById('reg-weight').value,null) : null;
  const goal = document.getElementById('reg-goal-btn').dataset.value || null;

  if(!name){ showToast('Enter your name'); return; }
  if(!email || !isValidEmail(email)){ showToast('Enter a valid email address'); return; }
  if(!password || password.length<8){ showToast('Password must be at least 8 characters'); return; }
  if(password!==confirm){ showToast('Passwords do not match'); return; }
  if(!terms){ showToast('Please accept the Terms of Service and Privacy Policy'); return; }

  const accountFields = { name, email, dob, sex, height, goal, marketingOptIn: marketing, createdAt: new Date().toISOString() };

  // Local-only mode: no server to register against, so behave as the app
  // originally did and just write the profile locally.
  if(!sb){
    state.account = accountFields;
    await saveKey('account');
    if(weight!=null) await recordStartingWeight(weight);
    showToast(`Welcome, ${name.split(' ')[0]}`);
    render();
    return;
  }

  setAuthBusy(true, 'Creating account…');
  try{
    const { data, error } = await sb.auth.signUp({
      email, password,
      options:{ data:{ name, marketing_opt_in: marketing } }
    });
    if(error) throw error;

    if(!data.session){
      // Supabase's "Confirm email" setting is on (the default). The account now
      // exists but can't be used until the emailed link is clicked, so say so
      // rather than appearing to fail silently.
      setAuthBusy(false);
      pendingConfirmEmail = email;
      state.authMode = 'confirm';
      render();
      return;
    }
    session = data.session;
    await afterSignIn(accountFields, weight);
  }catch(e){
    setAuthBusy(false);
    showToast(authError(e));
  }
}

function skipRegistration(){
  state.account = { name:'Dev User', email:'dev@local', dob:null, sex:null, height:null, goal:null, marketingOptIn:false, createdAt:new Date().toISOString() };
  saveKey('account');
  render();
}

function signOut(){
  const msg = sb
    ? 'You can sign back in any time — your workouts are saved to your account.'
    : 'You can sign back in any time — your data stays saved on this device.';
  confirmDialog('Sign out?', msg, 'Sign Out', async ()=>{
    stopTickers();
    if(sb){
      try{ await sb.auth.signOut(); }catch(e){ console.warn('Sign-out call failed:', e.message||e); }
      session = null;
      // Clear in-memory data so that if a different account signs in on this
      // device, none of the previous account's data is visible in the gap
      // before their own load completes. The per-account localStorage cache is
      // left alone — it's namespaced by user id, so it can't leak across
      // accounts, and it keeps offline sign-in working.
      for(const k of STATE_KEYS) state[k] = DEFAULTS[k]();
    }else{
      // Local-only mode: only forget the profile. Deleting the rest would throw
      // away the single copy of this person's history.
      state.account = null;
      await deleteKeySafe('account');
    }
    state.account = null;
    state.tab = 'home'; state.stack = [];
    state.authMode = 'login'; state.authBusy = false;
    render();
  }, true);
}

function renderWorkoutExercise(ex, exIdx){
  const exDef = getExercise(ex.exerciseId);
  const last = getLastPerformance(ex.exerciseId, null);
  const isBW = ex.type==='bodyweight';
  const isCardio = ex.type==='cardio';
  const noteText = exDef ? (exDef.notes||'') : (ex.notes||'');
  const setsHtml = ex.sets.map((s,sIdx)=>{
    const prevSet = last && last.sets.filter(x=>x.completed)[sIdx];
    let prevTxt = '—';
    if(prevSet){
      if(isCardio) prevTxt = prevSet.distance!=null ? `${prevSet.duration}min·${prevSet.distance}km` : `${prevSet.duration}min`;
      else if(isBW) prevTxt = `${prevSet.reps}`;
      else prevTxt = `${prevSet.weight}×${prevSet.reps}`;
    }
    let fields;
    if(isCardio){
      fields = `<input type="number" inputmode="decimal" step="1" placeholder="min" data-bind="set-duration:${exIdx}:${sIdx}" value="${s.duration!=null?s.duration:''}">
        <input type="number" inputmode="decimal" step="0.1" placeholder="km" data-bind="set-distance:${exIdx}:${sIdx}" value="${s.distance!=null?s.distance:''}">`;
    } else if(isBW){
      fields = `<input type="number" inputmode="numeric" step="1" placeholder="reps" data-bind="set-reps:${exIdx}:${sIdx}" value="${s.reps!=null?s.reps:''}">`;
    } else {
      fields = `<input type="number" inputmode="decimal" step="0.5" placeholder="kg" data-bind="set-weight:${exIdx}:${sIdx}" value="${s.weight!=null?s.weight:''}">
        <input type="number" inputmode="numeric" step="1" placeholder="reps" data-bind="set-reps:${exIdx}:${sIdx}" value="${s.reps!=null?s.reps:''}">`;
    }
    return `
    <div class="set-swipe-wrap" data-ex-idx="${exIdx}" data-set-idx="${sIdx}">
      <div class="set-swipe-bg" data-action="delete-set:${exIdx}:${sIdx}">${ic('trash')}</div>
      <div class="set-row ${isBW?'bw':''} ${s.completed?'done':''}">
        <div class="idx">${sIdx+1}</div>
        <div class="prev">${esc(prevTxt)}</div>
        ${fields}
        <button class="set-check ${s.completed?'done':''}" data-action="toggle-set:${exIdx}:${sIdx}">${ic('check','sm')}</button>
      </div>
    </div>`;
  }).join('');
  let headSpans;
  if(isCardio) headSpans = `<span></span><span>Prev</span><span>Min</span><span>Km</span><span></span>`;
  else if(isBW) headSpans = `<span></span><span>Prev</span><span>Reps</span><span></span>`;
  else headSpans = `<span></span><span>Prev</span><span>Kg</span><span>Reps</span><span></span>`;
  return `
  <div class="wk-ex-card">
    <div class="wk-ex-head">
      <div>
        <div class="n">${esc(ex.name)}</div>
        <div class="g">${esc(ex.muscleGroup)}</div>
      </div>
      <button class="mini-btn" data-action="ex-info:${exIdx}">${ic('info','sm')}</button>
    </div>
    ${noteText.trim() ? `<textarea class="notes-box" rows="2" placeholder="Notes — rack height, seat position, form cues" data-bind="ex-notes:${exIdx}">${esc(noteText)}</textarea>` : ''}
    <div class="set-grid-head ${isBW?'bw':''}">${headSpans}</div>
    ${setsHtml}
    <button class="add-set-btn" data-action="add-set:${exIdx}">${ic('plus','sm')} Add Set</button>
  </div>`;
}

function getCardioStats(exerciseId, historyList){
  let longestDuration=0, longestDistance=0, sessionCount=0;
  for(const w of historyList){
    const ex = w.exercises.find(e=>e.exerciseId===exerciseId);
    if(!ex || ex.type!=='cardio') continue;
    let any=false;
    for(const s of ex.sets){
      if(!s.completed) continue;
      any=true;
      if((s.duration||0)>longestDuration) longestDuration=s.duration;
      if((s.distance||0)>longestDistance) longestDistance=s.distance;
    }
    if(any) sessionCount++;
  }
  return {longestDuration, longestDistance, sessionCount};
}

function prLabel(p){
  if(p.type==='weight') return `${p.value}kg PR`;
  if(p.type==='1rm') return `~${p.value}kg 1RM PR`;
  if(p.type==='volume') return `${p.value}kg vol PR`;
  if(p.type==='reps') return `${p.value} rep PR`;
  if(p.type==='duration') return `${p.value}min PR`;
  if(p.type==='distance') return `${p.value}km PR`;
  return 'PR';
}

function renderMeasureChart(fieldId){
  if(!fieldId) return `<div class="chart-empty">Add a field first</div>`;
  const sorted = state.measurements.filter(e=>e.values[fieldId]!=null).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const pts = sorted.map(e=>({x:new Date(e.date).getTime(), y:e.values[fieldId], id:e.id}));
  const field = state.measurementFields.find(f=>f.id===fieldId);
  const unit = field ? field.unit : '';
  const chart = buildLineChart(pts, {colorStart:cv('--blue'), colorEnd:cv('--accent'), yFmt:v=>round1(v), pointAction:'edit-measurement'});
  let summary = '';
  if(pts.length>=2){
    const first = pts[0], last = pts[pts.length-1];
    const change = round1(last.y-first.y);
    const days = Math.max(1, Math.round((last.x-first.x)/86400000));
    const changeColor = change<0?'var(--blue)':(change>0?'var(--accent)':'var(--text-dim)');
    summary = `
      <div class="trend-summary">
        <div class="ts-row"><span>Initial</span><b>${round1(first.y)}${esc(unit)}</b></div>
        <div class="ts-row"><span>Latest</span><b>${round1(last.y)}${esc(unit)}</b></div>
        <div class="ts-row"><span>Change</span><b style="color:${changeColor};">${change>0?'+':''}${change}${esc(unit)} · ${days}d</b></div>
      </div>`;
  } else if(pts.length===1){
    summary = `<p class="hint" style="text-align:center; margin-top:8px;">Log another entry to start seeing a trend.</p>`;
  }
  return `<p class="hint" style="text-align:center; margin-bottom:2px;">Tap a point on the line to view or edit that entry.</p>${chart}${summary}`;
}

function activeGoalList(){
  const g = state.goals;
  const list = [];
  if(g.calories) list.push({key:'calories', label:'Calories', unit:'kcal', target:g.calories});
  if(g.protein) list.push({key:'protein', label:'Protein', unit:'g', target:g.protein});
  if(g.water) list.push({key:'water', label:'Water', unit:'L', target:g.water});
  if(g.steps) list.push({key:'steps', label:'Steps', unit:'', target:g.steps});
  if(g.supplements) list.push({key:'supplements', label:'Supplements', unit:'', target:1});
  return list;
}
function renderGoalsBlock(dateISO){
  const active = activeGoalList();
  if(active.length===0) return `<div class="empty">${ic('flag')}<h3>No goals set</h3><p>Set your daily targets above to start tracking.</p></div>`;
  const log = state.dailyLogs.find(d=>d.date===dateISO) || {};
  const rows = active.map(goalDef=>{
    if(goalDef.key==='supplements'){
      const taken = !!log.supplements;
      return `<div class="goal-row">
        <div class="goal-row-top"><span class="gname">Supplements</span><span class="gval">${taken?ic('check','sm'):''}</span></div>
        <label class="goal-check"><input type="checkbox" id="gl-supplements" ${taken?'checked':''}> Taken today</label>
      </div>`;
    }
    const v = log[goalDef.key];
    const pct = v!=null ? Math.max(0,Math.min(100, Math.round(v/goalDef.target*100))) : 0;
    const hit = v!=null && v>=goalDef.target;
    return `<div class="goal-row">
      <div class="goal-row-top"><span class="gname">${goalDef.label}</span><span class="gval">${v!=null?v:'—'} / ${goalDef.target}${goalDef.unit?(' '+goalDef.unit):''} ${hit?ic('check','sm'):''}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${hit?'var(--accent)':'var(--blue)'};"></div></div>
      <input type="number" step="${goalDef.key==='water'?'0.1':'1'}" inputmode="${goalDef.key==='water'?'decimal':'numeric'}" id="gl-${goalDef.key}" placeholder="Log ${goalDef.label.toLowerCase()}" value="${v!=null?v:''}">
    </div>`;
  }).join('');
  return rows + `<button class="btn primary sm" style="width:100%;margin-top:4px;" data-action="save-daily-log:${dateISO}">Save</button>`;
}
function dayHasWorkout(dateISO){
  return state.history.some(w=>fmtDateISO(w.startTime)===dateISO);
}
function dayGoalsHit(dateISO){
  const active = activeGoalList();
  if(active.length===0) return null;
  const log = state.dailyLogs.find(d=>d.date===dateISO);
  if(!log) return false;
  return active.every(goalDef=>{
    if(goalDef.key==='supplements') return !!log.supplements;
    const v = log[goalDef.key];
    return v!=null && v>=goalDef.target;
  });
}
